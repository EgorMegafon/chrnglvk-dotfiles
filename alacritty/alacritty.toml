[general]

[colors.primary]
background = '#111318'
foreground = '#e2e2e9'

[colors.selection]
text = '#e2e2e9'
background = '#2b4678'

[colors.cursor]
text = '#111318'
cursor = '#adc6ff'

[colors.normal]
black   = '#111318'
red     = '#ff7299'
green   = '#7fff92'
yellow  = '#fff872'
blue    = '#94b1f2'
magenta = '#304576'
cyan    = '#adc6ff'
white   = '#eff4ff'

[colors.bright]
black   = '#999da5'
red     = '#ff9fb9'
green   = '#a5ffb3'
yellow  = '#fffaa5'
blue    = '#b9ceff'
magenta = '#c5d7ff'
cyan    = '#dae5ff'
white   = '#f8faff'


[window]
decorations = "None"
padding = { x = 12, y = 12 }
opacity = 1.0

[scrolling]
history = 3023

[cursor]
style = { shape = "Beam", blinking = "Off" }
blink_interval = 1000
unfocused_hollow = false

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\u001b\r" },
]
